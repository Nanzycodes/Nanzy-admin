name: Staging CI

on:
  push:
    branches: [ dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
    name: Build, Scan, and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write 
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Scan Dockerfile and IaC before building
      - name: Run Trivy scan on Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Build image once with caching
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.STAGING_NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_API_URL=${{secrets.STAGING_NEXT_PUBLIC_API_URL}}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Scan the built image for vulnerabilities
      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
      
      # # Generate SARIF report for GitHub Security tab
      # - name: Run Trivy and generate SARIF report
      #   if: always()
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH,MEDIUM,LOW'
      
      # - name: Upload Trivy SARIF results to GitHub Security
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: 'trivy-results.sarif'
      
      # Generate JSON report as artifact
      - name: Generate JSON vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail, just generate report
      
      - name: Upload Trivy JSON results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 30
            # Push image only if all scans passed
      - name: Push Docker image to registry
        if: success()
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "Pushing image tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
          docker push --all-tags "$IMAGE_NAME_LOWER"
      
      - name: Image digest
        if: success()
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"


notify:
    name: Notify Subscribers
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: "Notify Docker deploy Repo"
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TOKEN }}
          repository: Qudra-IO/docker-deploy
          event-type: pearly-admin.build
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "branch": "dev"}'
